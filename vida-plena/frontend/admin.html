<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Vida Plena – Painel do corretor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Painel do corretor: mesmas cores e fonte do app (azul e branco). Só para uso interno. */
:root{color-scheme:light;--bg:#f3f8ff;--card:#fff;--ink:#0d2140;--mute:#5a6b85;--line:#d7e5f8;--grid:#e6eef9;
--b:#0a56c2;--bd:#073f91;--sky:#e8f2ff;--ok:#0b6b3a;--okbg:#e3f5ea;--warn:#8a5300;--warnbg:#fff3df;--no:#5a6b85;--nobg:#eef1f5;--err:#b42318}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
.top{background:linear-gradient(160deg,var(--b),var(--bd));color:#fff}
.top .in{max-width:1200px;margin:0 auto;padding:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:18px}.brand svg{width:26px;height:26px;flex:none}
.brand small{font-weight:600;opacity:.85;font-size:13px}
.sair{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;padding:6px 14px;cursor:pointer;font-weight:700}
nav{max-width:1200px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
nav button{background:none;border:0;color:#fff;opacity:.8;padding:10px 14px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-current=page]{opacity:1;border-color:#fff}
main{max-width:1200px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0 0 12px}
.sub{color:var(--mute);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.kpi span{color:var(--mute);font-size:13px;font-weight:700;display:block}
.kpi b{font-size:26px;display:block;margin:2px 0;font-variant-numeric:tabular-nums}
.kpi small{color:var(--mute)}
.grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
@media(max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.filtros label{display:flex;flex-direction:column;font-size:12.5px;font-weight:700;color:var(--mute);gap:4px}
input,select{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;min-height:40px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--b);outline-offset:1px}
.btn{background:var(--b);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;min-height:40px}
.btn:hover{background:var(--bd)}.btn[disabled]{opacity:.5;cursor:default}
.btn.sec{background:#fff;color:var(--b);border:1.5px solid var(--line)}
.btn.peq{padding:5px 10px;min-height:32px;font-size:13px}
.tabela{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.03em;background:var(--sky);padding:9px 12px;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
tfoot td{font-weight:800;background:#fafcff}
td small{color:var(--mute);display:block}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap;background:var(--sky);color:var(--bd)}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.no{background:var(--nobg);color:var(--no)}
.vazio{color:var(--mute);text-align:center;padding:24px}
.erro{color:var(--err);font-weight:700;min-height:1.5em}
.msg{background:var(--sky);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.sw{position:relative;width:44px;height:24px;border-radius:99px;border:0;background:#c5d3e6;cursor:pointer;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked=true]{background:var(--b)}.sw[aria-checked=true]::after{left:23px}
.login{max-width:400px;margin:8vh auto;padding:0 16px}
.login .card{padding:24px}.login label{display:block;font-weight:700;margin:14px 0 6px}.login input{width:100%}
.login .btn{width:100%;margin-top:14px}
/* gráfico */
.grafico{position:relative}
.grafico svg{display:block;width:100%;height:auto;overflow:visible}
.grafico .grade{stroke:var(--grid);stroke-width:1}.grafico .barra{fill:var(--b)}.grafico .alvo{fill:transparent;outline:none}
.grafico .alvo:focus-visible{stroke:var(--b);stroke-width:2}
.grafico .eixo{fill:var(--mute);font-size:11px}
.grafico .rot{fill:var(--ink);font-size:11.5px;font-weight:700}
.dica{position:absolute;pointer-events:none;background:var(--ink);color:#fff;border-radius:8px;padding:6px 10px;font-size:13px;white-space:nowrap;transform:translate(-50%,-110%);display:none}
details.tab summary{cursor:pointer;color:var(--b);font-weight:700;font-size:13.5px;margin-top:8px}
.linha{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.linha:first-of-type{border-top:0}
a.link{color:var(--b);font-weight:700;cursor:pointer;text-decoration:underline}
@media(prefers-reduced-motion:reduce){.sw::after{transition:none}}
</style>
</head>
<body>
<div id="raiz"></div>
<script src="admin.js"></script>
</body>
</html>
